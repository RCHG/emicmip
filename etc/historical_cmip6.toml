# historical_cmip6.toml                                (updated 2026-08)
#
# Author:  Ramiro Checa-Garcia (KNMI)
# Purpose: Configuration for CMIP6 historical emissions processing
#
# Note:  Version fields are lists - code tries each in order until found.
#        species_filename_map controls output filename for each species.
#        Ported from the legacy `CMIP6:` section of etc/historical.yaml.
#

[CMIP6]
    # Settings of paths
    rawpath           = "/hpcperm/{user}/raw_emissions"
    propath           = "/ec/res4/scratch/{user}/emissions/cmip6hist/temp/"
    outpath           = "/ec/res4/scratch/{user}/emissions/cmip6hist"
    tar_store         = { cmd = "ecp", path = "ec:/{user}/emissions/cmip6hist/" }
    tar_common        = "CMIP6hist-2018-08-30"

    # General info of emissions dataset
    origin            = "input4MIPs"
    category          = "emissions"
    target_mip        = "CMIP"
    outputname        = "CMIP6-jointversion"

    # -------------------------------------------------------------------
    # Anthropogenic surface emissions
    # -------------------------------------------------------------------
    [CMIP6.anthro]
        version       = ["CEDS-2017-05-18", "CEDS-2017-05-18-supplemental-data"]
        path          = "cmip6/historical-2017-05-18/"
        sectors       = ["AGR", "ENE", "IND", "TRA", "RCO", "SLV", "WST", "SHP"]
        resol         = ["global_0.5", "05x05"]
        years         = [
            "185001-185012", "185101-189912",
            "190001-194912", "195001-199912", "200001-201412"
        ]

        [CMIP6.anthro.subsets.em-anthro]
            suffix    = "anthro-surf"
            species   = ["BC", "CH4", "NH3", "NMVOC", "NOx", "OC", "SO2", "CO"]

        [CMIP6.anthro.subsets."em-speciated-VOC-anthro"]
            suffix    = "anthro-surf"
            species   = [
                "VOC01-alcohols", "VOC02-ethane",
                "VOC03-propane", "VOC04-butanes", "VOC05-pentanes",
                "VOC06-hexanes-pl", "VOC07-ethene", "VOC08-propene",
                "VOC09-ethyne", "VOC12-other-alke", "VOC13-benzene",
                "VOC14-toluene", "VOC15-xylene", "VOC16-trimethylb",
                "VOC17-other-arom", "VOC18-esters", "VOC19-ethers",
                "VOC20-chlorinate", "VOC21-methanal", "VOC22-other-alka",
                "VOC23-ketones", "VOC24-acids", "VOC25-other-voc"
            ]

        [CMIP6.anthro.subsets."em-speciated-VOC-anthro".species_filename_map]
            "VOC01-alcohols"  = "VOC01"
            "VOC02-ethane"    = "VOC02"
            "VOC03-propane"   = "VOC03"
            "VOC04-butanes"   = "VOC04"
            "VOC05-pentanes"  = "VOC05"
            "VOC06-hexanes-pl" = "VOC06"
            "VOC07-ethene"    = "VOC07"
            "VOC08-propene"   = "VOC08"
            "VOC09-ethyne"    = "VOC09"
            "VOC12-other-alke" = "VOC12"
            "VOC13-benzene"   = "VOC13"
            "VOC14-toluene"   = "VOC14"
            "VOC15-xylene"    = "VOC15"
            "VOC16-trimethylb" = "VOC16"
            "VOC17-other-arom" = "VOC17"
            "VOC18-esters"    = "VOC18"
            "VOC19-ethers"    = "VOC19"
            "VOC20-chlorinate" = "VOC20"
            "VOC21-methanal"  = "VOC21"
            "VOC22-other-alka" = "VOC22"
            "VOC23-ketones"   = "VOC23"
            "VOC24-acids"     = "VOC24"
            "VOC25-other-voc" = "VOC25"

        [CMIP6.anthro.subsets.em-SOLID-BIOFUEL-anthro]
            suffix    = "anthro-biof"
            species   = ["BC", "OC"]

    # -------------------------------------------------------------------
    # Anthropogenic aviation emissions
    # -------------------------------------------------------------------
    [CMIP6.aviation]
        version       = ["CEDS-2017-08-30"]
        path          = "cmip6/historical-2017-08-30/"
        sectors       = ["AVI"]
        resol         = ["global_0.5", "05x05"]
        years         = ["190001-194912", "195001-199912", "200001-201412"]

        [CMIP6.aviation.subsets.em-AIR-anthro]
            suffix    = "anthro-air"
            species   = ["BC", "CO2", "CO", "NH3", "NMVOC", "NOx", "OC", "SO2"]

    # -------------------------------------------------------------------
    # Biomass burning emissions
    # -------------------------------------------------------------------
    [CMIP6.bburning]
        version       = ["VUA-CMIP-BB4CMIP6-1-2"]
        path          = "cmip6/historical-bb/"
        sectors       = ["biomass_burning"]
        resol         = ["global_0.25", "025x025"]
        years         = ["185001-201512"]

        [CMIP6.bburning.subsets.em-biomassburning]
            suffix    = "bburning"
            species   = [
                "BC", "CH4", "CO", "CO2", "NH3", "C10H16", "C2H4",
                "C2H4O", "C2H5OH", "C2H6", "C2H6S",
                "C3H6", "C3H6O", "C3H8", "C5H8",
                "C6H6", "C7H8", "C8H10", "CH2O",
                "CH3COCHO", "CH3COOH", "CH3OH",
                "HCOOH", "HigherAlkanes", "HigherAlkenes",
                "MEK", "NOx", "OC", "SO2"
            ]
